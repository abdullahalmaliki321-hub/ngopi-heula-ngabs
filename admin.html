<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Order - Ngopi Heula Ngabs</title>
<style>
:root{--bd:#2c1a0e;--bm:#5c3d2e;--gold:#c8973a;--cream:#f5efe6;--white:#fdfaf6;--muted:#8a6a50;--green:#27ae60;--red:#c0392b;}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:var(--cream);color:var(--bd);min-height:100vh}.wrap{max-width:1180px;margin:0 auto;padding:28px 16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.top h1{font-size:24px}.panel{background:var(--white);border:1px solid #eadfd4;border-radius:14px;padding:18px;box-shadow:0 12px 28px rgba(44,26,14,.08)}.login{max-width:380px;margin:80px auto}.fg{margin-bottom:12px}.fg label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}.fg input{width:100%;padding:12px 14px;border:1px solid #dbcfc3;border-radius:10px;font-size:15px}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700;background:var(--bd);color:#fff}.btn.secondary{background:#efe4da;color:var(--bd)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-size:13px;color:var(--muted);margin:10px 0}.table-wrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff}.tbl th{background:var(--bd);color:#fff;text-align:left;padding:10px;white-space:nowrap}.tbl td{border-bottom:1px solid #eee;padding:10px;vertical-align:top}.badge{display:inline-block;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:700}.pending{background:#fff3cd;color:#856404}.lunas{background:#d1fae5;color:#065f46}.cod{background:#e0e7ff;color:#3730a3}.empty{padding:32px;text-align:center;color:var(--muted)}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.tbl{font-size:12px}}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:#ede3d8;border-radius:12px;padding:4px}.tab{flex:1;text-align:center;padding:10px 8px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);transition:all .2s;border:none;background:transparent}.tab.active{background:var(--bd);color:#fff;box-shadow:0 2px 8px rgba(44,26,14,.2)}.tab-page{display:none}.tab-page.active{display:block}.cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:8px}.card{background:var(--cream);border-radius:12px;padding:16px;border:1px solid #e0d4c4}.card .card-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}.card .card-value{font-size:26px;font-weight:800;color:var(--bd)}.card.card-gold{background:linear-gradient(135deg,#2c1a0e,#5c3d2e);border-color:transparent}.card.card-gold .card-label{color:var(--gold)}.card.card-gold .card-value{color:#fff;font-size:20px}.card.card-green .card-value{color:var(--green)}.card.card-red .card-value{color:var(--red)}.section-title{font-size:12px;font-weight:700;color:var(--bm);margin:16px 0 10px;text-transform:uppercase;letter-spacing:.6px;padding-bottom:6px;border-bottom:2px solid var(--cream)}.rating-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}.rating-row .star-label{width:36px;text-align:right;font-weight:700;color:var(--bm)}.bar-wrap{flex:1;background:#e0d4c4;border-radius:99px;height:10px;overflow:hidden}.bar-fill{height:100%;background:var(--gold);border-radius:99px;transition:width .4s ease}.rating-row .bar-count{width:24px;font-size:12px;color:var(--muted);font-weight:700}.review-item{border-bottom:1px solid #eee;padding:12px 0}.review-item:last-child{border-bottom:0;padding-bottom:0}.review-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:6px;gap:10px}.review-name{font-weight:700;color:var(--bd);font-size:13px}.review-stars{color:var(--gold);font-size:14px;margin-bottom:4px;font-weight:700}.review-text{font-size:13px;color:var(--bm);margin:4px 0 8px;line-height:1.4}.review-badges{display:flex;gap:6px;flex-wrap:wrap}.rbadge{display:inline-block;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700}.rbadge.yes{background:#d1fae5;color:#065f46}.rbadge.no{background:#fee2e2;color:#991b1b}.state-box{padding:32px;text-align:center;color:var(--muted)}.state-icon{font-size:24px;margin-bottom:8px}.state-msg{font-size:14px}.loading-spin{display:inline-block;width:28px;height:28px;border:3px solid #e0d4c4;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:8px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:400px){.cards-grid{grid-template-columns:1fr}}
.fg select,.fg textarea{width:100%;padding:12px 14px;border:1px solid #dbcfc3;border-radius:10px;font-size:15px;background:#fff}.fg textarea{min-height:74px;resize:vertical}.btn:disabled{opacity:.6;cursor:not-allowed}.tabs{overflow:auto}.tab{white-space:nowrap}.done{background:#e8f8e8;color:#1f7a4d}.cancel{background:#fee2e2;color:#991b1b}.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.inline-form{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.inline-form .fg{flex:1;min-width:180px}.stock-low{color:#d97706;font-weight:700}.stock-out{color:var(--red);font-weight:700}.stock-ok{color:var(--green);font-weight:700}@media(max-width:700px){.settings-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel login" id="loginBox">
    <h1 style="margin-bottom:14px">Admin Order</h1>
    <div class="fg"><label>PIN Admin</label><input id="pin" type="password" inputmode="numeric" placeholder="Masukkan PIN" /></div>
    <button class="btn" id="btnLogin" type="button">Masuk</button>
    <p class="status" id="loginStatus"></p>
  </div>

  <div id="app" style="display:none">
    <div class="top">
      <h1>Ngopi Heula Ngabs</h1>
      <div class="actions">
        <button class="btn secondary" id="btnRefresh" type="button">Refresh</button>
        <button class="btn secondary" id="btnExport" type="button">Export CSV</button>
        <button class="btn red" id="btnLogout" type="button">Keluar</button>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" id="tabOrder" onclick="switchTab('order')">Order</button>
      <button class="tab" id="tabPayment" onclick="switchTab('payment')">Pelunasan</button>
      <button class="tab" id="tabProduction" onclick="switchTab('production')">Produksi</button>
      <button class="tab" id="tabDelivery" onclick="switchTab('delivery')">Delivery</button>
      <button class="tab" id="tabDashboard" onclick="switchTab('dashboard')">Dashboard</button>
      <button class="tab" id="tabStock" onclick="switchTab('stock')">Stok</button>
      <button class="tab" id="tabSettings" onclick="switchTab('settings')">Settings</button>
      <button class="tab" id="tabReview" onclick="switchTab('review')">Review</button>
    </div>
    <div class="tab-page active" id="pageOrder">
      <div class="panel">
        <p class="status" id="status">Memuat data...</p>
        <div class="table-wrap" id="tableWrap"></div>
      </div>
    </div>
    <div class="tab-page" id="pagePayment">
      <div class="panel"><p class="status">Order yang menunggu konfirmasi pembayaran.</p><div class="table-wrap" id="paymentWrap"></div></div>
    </div>
    <div class="tab-page" id="pageProduction">
      <div class="panel"><p class="status">Order lunas yang sedang disiapkan.</p><div class="table-wrap" id="productionWrap"></div></div>
    </div>
    <div class="tab-page" id="pageDelivery">
      <div class="panel"><p class="status">Order yang siap dikirim atau sedang diantar.</p><div class="table-wrap" id="deliveryWrap"></div></div>
    </div>
    <div class="tab-page" id="pageDashboard">
      <div class="panel"><div id="dashboardContent"><div class="state-box"><div class="loading-spin"></div><div class="state-msg">Memuat dashboard...</div></div></div></div>
    </div>
    <div class="tab-page" id="pageStock">
      <div class="panel"><div id="stockContent"><div class="state-box"><div class="loading-spin"></div><div class="state-msg">Memuat stok...</div></div></div></div>
    </div>
    <div class="tab-page" id="pageSettings">
      <div class="panel"><div id="settingsContent"><div class="state-box"><div class="loading-spin"></div><div class="state-msg">Memuat settings...</div></div></div></div>
    </div>
    <div class="tab-page" id="pageReview">
      <div class="panel"><div id="reviewContent"><div class="state-box"><div class="loading-spin"></div><div class="state-msg">Memuat review...</div></div></div></div>
    </div>
  </div>
</div>
<script>
(function(){
  var API_URL = window.NHG_API_URL || 'https://script.google.com/macros/s/AKfycbwCJlAqgtl8Fte_QsOolFj2Fl2dQZx3QBboNFK70d26O77f8hTd0mPL8enEBbNg3MAyfw/exec';
  var REVIEW_BASE_URL = window.NHG_REVIEW_URL || 'REVIEW.html';
  var pin = '', orders = [], settings = {};
  var loaded = {dashboard:false,review:false,stock:false,settings:false};
  var ORDER_STATUSES = ['Menunggu Pembayaran','Sedang Dibuat','Siap Dikirim','Diantar','Selesai','Dibatalkan'];
  function $(id){return document.getElementById(id);}
  function fmt(n){return 'Rp '+Number(n||0).toLocaleString('id-ID');}
  function feeText(v){return Number(v||0)===0 ? 'GRATIS' : fmt(v);}
  function esc(v){return String(v == null ? '' : v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function apiReady(){return API_URL && API_URL.indexOf('PASTE_APPS_SCRIPT') === -1;}
  function apiGet(action, params){if(!apiReady()) return Promise.reject(new Error('Endpoint Apps Script belum diisi.'));var qs=new URLSearchParams(Object.assign({action:action,pin:pin,t:Date.now()},params||{}));return fetch(API_URL+'?'+qs.toString()).then(function(r){return r.json();}).then(function(data){if(!data.ok) throw new Error(data.message||'API error');return data;});}
  function apiPost(payload){if(!apiReady()) return Promise.reject(new Error('Endpoint Apps Script belum diisi.'));payload.pin=pin;return fetch(API_URL,{method:'POST',body:JSON.stringify(payload)}).then(function(r){return r.text();}).then(function(text){var data=text?JSON.parse(text):{};if(!data.ok) throw new Error(data.message||'API error');return data;});}
  function show(msg){$('status').textContent=msg;}
  function cleanWaNumber(v){var n=String(v||'').replace(/\D/g,'');if(!n)return '';if(n.indexOf('62')===0)return n;if(n[0]==='0')return '62'+n.slice(1);if(n[0]==='8')return '62'+n;return n;}
  function items(o){var raw=o.items_json||o.items||[];if(typeof raw==='string'){try{raw=JSON.parse(raw||'[]');}catch(e){raw=[];}}if(!Array.isArray(raw))raw=[];if(!raw.length && o.pesanan_text){raw=String(o.pesanan_text).split(',').map(function(t){return {label:t.trim(),qty:1};});}return raw.map(function(i){return {variant_code:i.variant_code||'',label:i.label||i.menu||i.name||i.variant_code||'',qty:Number(i.qty||1),price:Number(i.price||i.harga_jual||0),subtotal:Number(i.subtotal||i.total||0)};});}
  function itemsText(o){return o.pesanan_text || o.pesanan || items(o).map(function(i){return i.label+' x'+i.qty;}).join(', ');}
  function badgeClass(status,type){var s=String(status||'').toLowerCase();if(type==='payment')return s==='lunas'?'lunas':'pending';if(s.indexOf('batal')>=0)return 'cancel';if(s.indexOf('selesai')>=0)return 'done';if(s.indexOf('diantar')>=0)return 'cod';if(s.indexOf('siap')>=0)return 'cod';return 'pending';}
  function statusBadges(o){var pay=o.payment_status||'Pending';var order=o.order_status||'-';var delivery=o.delivery_status||'-';return '<span class="badge '+badgeClass(pay,'payment')+'">Bayar: '+esc(pay)+'</span><br><span class="badge '+badgeClass(order,'order')+'" style="margin-top:4px">Order: '+esc(order)+'</span><br><span class="badge '+badgeClass(delivery,'delivery')+'" style="margin-top:4px">Delivery: '+esc(delivery)+'</span>';}
  function reviewLink(o){var url=new URL(REVIEW_BASE_URL, window.location.href);url.searchParams.set('order_id',o.order_id||o.oid||'');url.searchParams.set('name',o.nama||'');url.searchParams.set('wa',cleanWaNumber(o.whatsapp||o.wa||''));return url.href;}
  window.switchTab=function(name){['order','payment','production','delivery','dashboard','stock','settings','review'].forEach(function(t){var key=t.charAt(0).toUpperCase()+t.slice(1);$('tab'+key).classList.toggle('active',t===name);$('page'+key).classList.toggle('active',t===name);});if(name==='dashboard'&&!loaded.dashboard)loadDashboard();if(name==='stock'&&!loaded.stock)loadStock();if(name==='settings'&&!loaded.settings)loadSettings();if(name==='review'&&!loaded.review)loadReview();};
  async function load(){show('Memuat data...');try{var cfg=await apiGet('getSettings');settings=cfg.settings||{};if(settings.review_url)REVIEW_BASE_URL=settings.review_url;var data=await apiGet('listOrders');orders=data.orders||[];render();renderWorkTables();show(orders.length+' order ditemukan');loaded.dashboard=loaded.review=loaded.stock=false;}catch(err){show('Gagal memuat data: '+err.message);}}
  function render(){if(!orders.length){$('tableWrap').innerHTML='<div class="empty">Belum ada order</div>';return;}var rows=orders.map(function(o,idx){var oid=esc(o.order_id||o.oid||'');var paid=String(o.payment_status||'').toLowerCase()==='lunas';var status=o.order_status||'';var opts=ORDER_STATUSES.map(function(s){return '<option value="'+esc(s)+'" '+(s===status?'selected':'')+'>'+esc(s)+'</option>';}).join('');return '<tr><td>'+oid+'<br><small>'+esc((o.tanggal||o.tgl||'')+' '+(o.jam||''))+'</small></td><td><b>'+esc(o.nama||'')+'</b><br><small>'+esc(o.whatsapp||o.wa||'')+'</small></td><td>'+esc(itemsText(o))+'</td><td>'+fmt(o.subtotal_produk||o.sub)+'</td><td>'+feeText(o.ongkir_customer||o.fee)+'</td><td><b>'+fmt(o.total_bayar||o.total)+'</b></td><td>'+esc(o.metode_bayar||o.pay||'')+'</td><td>'+statusBadges(o)+'<br><small>Stok: '+(o.stok_diproses?'diproses':'belum')+'</small></td><td>'+esc(o.alamat||'')+'<br><small>'+esc(o.catatan||'-')+'</small></td><td class="actions"><button class="btn green" '+(paid?'disabled':'')+' onclick="window.markPaid('+idx+')">Lunas</button><select onchange="window.changeStatus('+idx+',this.value)">'+opts+'</select><button class="btn secondary" onclick="window.sendReceiptWA('+idx+')">Struk WA</button><button class="btn secondary" onclick="window.printReceipt('+idx+')">Print</button></td></tr>';}).join('');$('tableWrap').innerHTML='<table class="tbl"><thead><tr><th>ID</th><th>Customer</th><th>Pesanan</th><th>Subtotal</th><th>Ongkir</th><th>Total</th><th>Bayar</th><th>Status</th><th>Alamat</th><th>Aksi</th></tr></thead><tbody>'+rows+'</tbody></table>';}
  function renderWorkTables(){renderPaymentTable();renderProductionTable();renderDeliveryTable();}
  function miniOrderRow(o,idx,actionHtml){return '<tr><td><b>'+esc(o.order_id||o.oid||'')+'</b><br><small>'+esc((o.tanggal||o.tgl||'')+' '+(o.jam||''))+'</small></td><td>'+esc(o.nama||'')+'<br><small>'+esc(o.whatsapp||o.wa||'')+'</small></td><td>'+esc(itemsText(o))+'</td><td><b>'+fmt(o.total_bayar||o.total)+'</b></td><td>'+statusBadges(o)+'</td><td class="actions">'+actionHtml+'</td></tr>';}
  function miniTable(rows){return '<table class="tbl"><thead><tr><th>ID</th><th>Customer</th><th>Pesanan</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+rows+'</tbody></table>';}
  function renderPaymentTable(){var rows=orders.map(function(o,idx){return {o:o,idx:idx};}).filter(function(x){return String(x.o.payment_status||'').toLowerCase()!=='lunas';}).map(function(x){return miniOrderRow(x.o,x.idx,'<button class="btn green" onclick="window.markPaid('+x.idx+')">Konfirmasi Lunas</button>');}).join('');$('paymentWrap').innerHTML=rows?miniTable(rows):'<div class="empty">Tidak ada order menunggu pelunasan</div>';}
  function renderProductionTable(){var rows=orders.map(function(o,idx){return {o:o,idx:idx};}).filter(function(x){var paid=String(x.o.payment_status||'').toLowerCase()==='lunas';return paid && ['Sedang Dibuat','Siap Dikirim','Diantar'].indexOf(x.o.order_status||'')>=0;}).map(function(x){return miniOrderRow(x.o,x.idx,'<button class="btn secondary" onclick="window.changeStatus('+x.idx+',\'Sedang Dibuat\')">Sedang Dibuat</button><button class="btn secondary" onclick="window.changeStatus('+x.idx+',\'Siap Dikirim\')">Siap Dikirim</button><button class="btn green" onclick="window.changeStatus('+x.idx+',\'Selesai\')">Selesai</button>');}).join('');$('productionWrap').innerHTML=rows?miniTable(rows):'<div class="empty">Belum ada order produksi aktif</div>';}
  function renderDeliveryTable(){var rows=orders.map(function(o,idx){return {o:o,idx:idx};}).filter(function(x){var paid=String(x.o.payment_status||'').toLowerCase()==='lunas';return paid && ['Siap Dikirim','Diantar','Selesai'].indexOf(x.o.order_status||'')>=0;}).map(function(x){return miniOrderRow(x.o,x.idx,'<button class="btn secondary" onclick="window.updateDelivery('+x.idx+',\'Siap Dikirim\')">Siap</button><button class="btn secondary" onclick="window.updateDelivery('+x.idx+',\'Diantar\')">Diantar</button><button class="btn green" onclick="window.updateDelivery('+x.idx+',\'Selesai\')">Selesai</button>');}).join('');$('deliveryWrap').innerHTML=rows?miniTable(rows):'<div class="empty">Belum ada order delivery aktif</div>';}
  window.markPaid=async function(idx){var o=orders[idx];if(!o)return;if(!confirm('Konfirmasi order '+(o.order_id||o.oid)+' sudah lunas?'))return;var oldPayment=o.payment_status,oldStatus=o.order_status;o.payment_status='Lunas';if(!o.order_status||o.order_status==='Menunggu Pembayaran')o.order_status='Sedang Dibuat';o.stok_diproses=true;render();renderWorkTables();try{await apiPost({action:'markPaid',order_id:o.order_id||o.oid});loaded.dashboard=false;show('Order '+(o.order_id||o.oid)+' sudah Lunas.');}catch(err){o.payment_status=oldPayment;o.order_status=oldStatus;o.stok_diproses=false;render();renderWorkTables();alert(err.message);}};
  window.changeStatus=async function(idx,status){var o=orders[idx];if(!o)return;var old=o.order_status;o.order_status=status;render();renderWorkTables();try{await apiPost({action:'updateOrderStatus',order_id:o.order_id||o.oid,status:status});loaded.dashboard=false;}catch(err){o.order_status=old;render();renderWorkTables();alert(err.message);}};
  window.updateDelivery=async function(idx,status){var o=orders[idx];if(!o)return;var oldDelivery=o.delivery_status,oldOrder=o.order_status;o.delivery_status=status;if(status==='Diantar')o.order_status='Diantar';if(status==='Selesai')o.order_status='Selesai';render();renderWorkTables();try{await apiPost({action:'updateDeliveryStatus',order_id:o.order_id||o.oid,status_pengiriman:status});loaded.dashboard=false;}catch(err){o.delivery_status=oldDelivery;o.order_status=oldOrder;render();renderWorkTables();alert(err.message);}};
  async function loadDashboard(){setLoading('dashboardContent','Memuat dashboard penjualan...');try{var data=await apiGet('getSalesDashboard');loaded.dashboard=true;renderDashboard(data.dashboard||{});}catch(err){setError('dashboardContent',err.message);}}
  function renderDashboard(d){var best=d.varian_terlaris||{};var dist=d.variant_distribution||{};var status=d.order_status_summary||{};var html='<div class="cards-grid"><div class="card"><div class="card-label">Total Order</div><div class="card-value">'+(d.total_order||0)+'</div></div><div class="card card-gold"><div class="card-label">Omzet Lunas</div><div class="card-value">'+fmt(d.total_omzet_lunas||0)+'</div></div><div class="card card-green"><div class="card-label">Total Lunas</div><div class="card-value">'+(d.total_lunas||0)+'</div></div><div class="card card-red"><div class="card-label">Pending</div><div class="card-value">'+(d.total_pending||0)+'</div></div><div class="card"><div class="card-label">Total Cup Lunas</div><div class="card-value">'+(d.total_cup||0)+'</div></div><div class="card card-green"><div class="card-label">Varian Terlaris</div><div class="card-value" style="font-size:18px">'+esc(best.name||'-')+'<br><small>'+esc(best.qty||0)+' cup</small></div></div></div><div class="section-title">Distribusi Varian</div>';Object.keys(dist).forEach(function(k){html+='<div class="rating-row"><span class="star-label" style="width:120px">'+esc(k)+'</span><div class="bar-wrap"><div class="bar-fill" style="width:'+Math.min(100,dist[k]*10)+'%"></div></div><span class="bar-count">'+dist[k]+'</span></div>';});html+='<div class="section-title">Ringkasan Status</div>';Object.keys(status).forEach(function(k){html+='<p class="status"><b>'+esc(k)+':</b> '+status[k]+'</p>';});$('dashboardContent').innerHTML=html;}
  async function loadReview(){setLoading('reviewContent','Memuat dashboard review...');try{var data=await apiGet('getReviewDashboard');loaded.review=true;renderReview(data.reviews||{});}catch(err){setError('reviewContent',err.message);}}
  function renderReview(d){var total=d.total_review||0,avg=d.avg_rating?Number(d.avg_rating).toFixed(1):'0.0';var dist=d.rating_distribution||{},reviews=d.latest_reviews||[];var worth=(d.worth_it&&d.worth_it.Ya)||0,repeat=(d.repeat_intent&&d.repeat_intent.Ya)||0;var html='<div class="cards-grid"><div class="card"><div class="card-label">Total Review</div><div class="card-value">'+total+'</div></div><div class="card card-gold"><div class="card-label">Rating Rata-rata</div><div class="card-value">'+avg+'/5</div></div><div class="card card-green"><div class="card-label">Worth It Ya</div><div class="card-value">'+worth+'</div></div><div class="card card-green"><div class="card-label">Beli Lagi Ya</div><div class="card-value">'+repeat+'</div></div></div><div class="section-title">Distribusi Rating</div>';[5,4,3,2,1].forEach(function(star){var count=dist[star]||0,pct=total?Math.round(count/total*100):0;html+='<div class="rating-row"><span class="star-label">'+star+'/5</span><div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%"></div></div><span class="bar-count">'+count+'</span></div>';});html+='<div class="section-title">Review Terbaru</div>';if(!reviews.length)html+='<div class="state-box">Belum ada review</div>';reviews.forEach(function(r){html+='<div class="review-item"><div class="review-meta"><span class="review-name">'+esc(r.customer_name||'Anonim')+'</span><span>'+esc(r.order_id||'')+'</span></div><div class="review-stars">Rating '+esc(r.rating||0)+'/5</div><div class="review-text">'+esc(r.rasa||'-')+'</div>'+(r.testimoni?'<div class="review-text"><b>Catatan:</b> '+esc(r.testimoni)+'</div>':'')+'<div class="review-badges"><span class="rbadge yes">'+esc(r.menu||'-')+'</span><span class="rbadge yes">Manis: '+esc(r.tingkat_manis||'-')+'</span><span class="rbadge yes">Worth It: '+esc(r.worth_it||'-')+'</span><span class="rbadge yes">Beli Lagi: '+esc(r.repeat_intent||'-')+'</span></div></div>';});$('reviewContent').innerHTML=html;}
  async function loadStock(){setLoading('stockContent','Memuat stok...');try{var data=await apiGet('getStockSummary');loaded.stock=true;var stock=data.stock||[];if(!stock.length){$('stockContent').innerHTML='<div class="empty">Belum ada data stok</div>';return;}var rows=stock.map(function(s){var cls=String(s.status_stok||'').toLowerCase().indexOf('habis')>=0?'stock-out':(String(s.status_stok||'').toLowerCase().indexOf('menipis')>=0?'stock-low':'stock-ok');return '<tr><td><b>'+esc(s.bahan)+'</b><br><small>'+esc(s.satuan||'')+'</small></td><td>'+esc(s.stok_awal||0)+'</td><td>'+esc(s.stok_masuk||0)+'</td><td>'+esc(s.stok_keluar||0)+'</td><td><b>'+esc(s.stok_akhir||0)+'</b></td><td>'+esc(s.minimum_stok||0)+'</td><td class="'+cls+'">'+esc(s.status_stok||'-')+'</td></tr>';}).join('');$('stockContent').innerHTML='<table class="tbl"><thead><tr><th>Bahan</th><th>Awal</th><th>Masuk</th><th>Keluar</th><th>Akhir</th><th>Minimum</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table>';}catch(err){setError('stockContent',err.message);}}
  async function loadSettings(){setLoading('settingsContent','Memuat settings...');try{var data=await apiGet('getSettings');settings=data.settings||{};loaded.settings=true;renderSettings();}catch(err){setError('settingsContent',err.message);}}
  function renderSettings(){function val(k){return esc(settings[k]||'');}var html='<div class="settings-grid"><div class="fg"><label>Status Toko</label><select id="set_store_status"><option '+(settings.store_status==='OPEN'?'selected':'')+'>OPEN</option><option '+(settings.store_status==='CLOSED'?'selected':'')+'>CLOSED</option></select></div><div class="fg"><label>Mode Order</label><select id="set_order_mode"><option '+(settings.order_mode==='READY'?'selected':'')+'>READY</option><option '+(settings.order_mode==='PREORDER'?'selected':'')+'>PREORDER</option><option '+(settings.order_mode==='CLOSED'?'selected':'')+'>CLOSED</option></select></div><div class="fg"><label>Delivery</label><select id="set_delivery_status"><option '+(settings.delivery_status==='ON'?'selected':'')+'>ON</option><option '+(settings.delivery_status==='OFF'?'selected':'')+'>OFF</option></select></div><div class="fg"><label>Pickup</label><select id="set_pickup_status"><option '+(settings.pickup_status==='ON'?'selected':'')+'>ON</option><option '+(settings.pickup_status==='OFF'?'selected':'')+'>OFF</option></select></div><div class="fg"><label>Weekday Open</label><input id="set_weekday_open" value="'+val('weekday_open')+'"></div><div class="fg"><label>Weekday Close</label><input id="set_weekday_close" value="'+val('weekday_close')+'"></div><div class="fg"><label>Weekend Open</label><input id="set_weekend_open" value="'+val('weekend_open')+'"></div><div class="fg"><label>Weekend Close</label><input id="set_weekend_close" value="'+val('weekend_close')+'"></div><div class="fg"><label>Max Daily Cup</label><input id="set_max_daily_cup" value="'+val('max_daily_cup')+'"></div><div class="fg"><label>Free Ongkir Min</label><input id="set_free_ongkir_min" value="'+val('free_ongkir_min')+'"></div><div class="fg" style="grid-column:1/-1"><label>Review URL Publik</label><input id="set_review_url" value="'+val('review_url')+'"></div><div class="fg" style="grid-column:1/-1"><label>Pesan Tutup</label><textarea id="set_closed_message">'+val('closed_message')+'</textarea></div></div><button class="btn green" id="btnSaveSettings" type="button">Simpan Settings</button><p class="status" id="settingsStatus"></p>';$('settingsContent').innerHTML=html;$('btnSaveSettings').onclick=saveSettings;}
  async function saveSettings(){var keys=['store_status','order_mode','delivery_status','pickup_status','weekday_open','weekday_close','weekend_open','weekend_close','max_daily_cup','free_ongkir_min','review_url','closed_message'];var payload={};keys.forEach(function(k){payload[k]=$('set_'+k).value;});try{await apiPost({action:'updateSettings',settings:payload});$('settingsStatus').textContent='Settings tersimpan.';loaded.settings=false;}catch(err){$('settingsStatus').textContent=err.message;}}
  function setLoading(id,msg){$(id).innerHTML='<div class="state-box"><div class="loading-spin"></div><div class="state-msg">'+esc(msg)+'</div></div>';}
  function setError(id,msg){$(id).innerHTML='<div class="state-box"><div class="state-icon">!</div><div class="state-msg">Gagal memuat: '+esc(msg)+'</div></div>';}
  function receiptMessage(o){var lines=items(o).map(function(i){return (i.label||i.variant_code)+'\n'+i.qty+' x '+fmt(i.price)+' = '+fmt(i.subtotal||i.price*i.qty);}).join('\n\n');return '*NGOPI HEULA NGABS*\n\n*STRUK PEMBAYARAN*\nID ORDER : '+(o.order_id||o.oid||'')+'\nTANGGAL  : '+(o.tanggal||o.tgl||'')+' '+(o.jam||'')+'\n\nNAMA:\n'+(o.nama||'')+'\n\nPESANAN:\n'+lines+'\n\nSubtotal : '+fmt(o.subtotal_produk||o.sub)+'\nOngkir   : '+feeText(o.ongkir_customer||o.fee)+'\nTOTAL    : *'+fmt(o.total_bayar||o.total)+'*\n\nBayar    : '+(o.metode_bayar||o.pay||'')+'\nStatus   : LUNAS\n\nANTAR KE:\n'+(o.alamat||'')+'\n\nTerima kasih sudah order, Ngabs.\n\nBantu isi review singkat di sini:\n'+reviewLink(o);}
  window.sendReceiptWA=function(idx){var o=orders[idx];if(!o)return;var wa=cleanWaNumber(o.whatsapp||o.wa||'');if(!wa){alert('Nomor WA customer kosong');return;}window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(receiptMessage(o)),'_blank');};
  window.printReceipt=function(idx){var o=orders[idx];if(!o)return;var rows=items(o).map(function(i){return '<div style="margin:7px 0"><b>'+esc(i.label||i.variant_code)+'</b><br><span>'+i.qty+' x '+fmt(i.price)+' = '+fmt(i.subtotal||i.price*i.qty)+'</span></div>';}).join('');var w=window.open('','_blank');w.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Struk '+esc(o.order_id||o.oid||'')+'</title><style>@page{size:80mm auto;margin:0}body{font-family:Arial,sans-serif;margin:0;background:#eee;color:#241409}.paper{width:80mm;min-height:100vh;margin:0 auto;background:#fffaf3;padding:12px}.head{background:#2c1a0e;color:#f8efe4;text-align:center;border-radius:4px;padding:12px;margin-bottom:10px}.line{border-top:1px dashed #8a6a50;margin:8px 0}.row{display:flex;justify-content:space-between;font-size:12px;margin:4px 0}.total{background:#2c1a0e;color:#e8c47a;padding:10px;border-radius:4px;font-weight:900;display:flex;justify-content:space-between}.paid{border:2px solid #22aa61;color:#16a05a;text-align:center;font-weight:900;width:max-content;margin:10px auto;padding:5px 18px;border-radius:4px}.btns{display:flex;gap:8px;background:#eee;padding:8px}.btns button{flex:1;padding:10px;border:0;border-radius:8px;background:#2c1a0e;color:white;font-weight:800}@media print{body{background:white}.btns{display:none}}</style></head><body><div class="paper"><div class="head"><b>NGOPI HEULA NGABS</b><br>STRUK PEMBAYARAN</div><div class="row"><b>ID</b><span>'+esc(o.order_id||o.oid||'')+'</span></div><div class="row"><b>Tanggal</b><span>'+esc((o.tanggal||o.tgl||'')+' '+(o.jam||''))+'</span></div><div class="line"></div><b>'+esc(o.nama||'')+'</b><div class="line"></div>'+rows+'<div class="line"></div><div class="row"><span>Subtotal</span><span>'+fmt(o.subtotal_produk||o.sub)+'</span></div><div class="row"><span>Ongkir</span><span>'+feeText(o.ongkir_customer||o.fee)+'</span></div><div class="total"><span>TOTAL</span><span>'+fmt(o.total_bayar||o.total)+'</span></div><div class="paid">LUNAS</div><div class="line"></div><b>ANTAR KE:</b><br>'+esc(o.alamat||'')+'</div><div class="btns"><button onclick="window.print()">Print / Save PDF</button><button onclick="window.close()">Tutup</button></div></body></html>');w.document.close();w.focus();};
  function exportCsv(){var header=['ID','Tanggal','Jam','Nama','WA','Pesanan','Subtotal','Ongkir','Total','Bayar','Payment','Order Status','Alamat','Catatan','Stok Diproses'];var lines=[header].concat(orders.map(function(o){return [o.order_id||o.oid,o.tanggal||o.tgl,o.jam,o.nama,o.whatsapp||o.wa,itemsText(o),o.subtotal_produk||o.sub,o.ongkir_customer||o.fee,o.total_bayar||o.total,o.metode_bayar||o.pay,o.payment_status,o.order_status,o.alamat,o.catatan,o.stok_diproses];}));var csv=lines.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='orders-ngopi-heula.csv';a.click();URL.revokeObjectURL(a.href);}
  $('btnLogin').onclick=function(){pin=$('pin').value.trim();if(!pin){$('loginStatus').textContent='PIN wajib diisi';return;}$('loginBox').style.display='none';$('app').style.display='block';load();};
  $('btnRefresh').onclick=function(){loaded={dashboard:false,review:false,stock:false,settings:false};load();var active=document.querySelector('.tab.active');if(active){var name=active.id.replace('tab','').toLowerCase();if(name!=='order')window.switchTab(name);}};
  $('btnExport').onclick=exportCsv;
  $('btnLogout').onclick=function(){location.reload();};
})();
